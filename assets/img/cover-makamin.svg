<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Fraud detection illustration: a risk gauge beside a transaction network with a few flagged nodes">
<style>@media (prefers-reduced-motion: no-preference){.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}.n1{animation-delay:.5s}.n2{animation-delay:.7s}.n3{animation-delay:.9s}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}.arc{stroke-dasharray:260;stroke-dashoffset:260;animation:arc 1.6s cubic-bezier(.3,.6,.2,1) .3s forwards}@keyframes arc{to{stroke-dashoffset:60}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out 1.6s infinite;opacity:0}@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}}</style>
<rect width="800" height="500" fill="#003049"/>
<circle cx="110" cy="440" r="190" fill="#0B4466" opacity=".55"/>
<!-- network card -->
<g transform="translate(300 60)">
<rect width="440" height="380" rx="22" fill="#FFFFFF"/>
<rect x="28" y="28" width="130" height="12" rx="6" fill="#003049"/>
<rect x="28" y="50" width="190" height="8" rx="4" fill="#A9C3D3"/>
<g stroke="#A9C3D3" stroke-width="2">
<line x1="220" y1="220" x2="110" y2="130"/><line x1="220" y1="220" x2="180" y2="110"/><line x1="220" y1="220" x2="270" y2="105"/><line x1="220" y1="220" x2="350" y2="140"/><line x1="220" y1="220" x2="380" y2="230"/><line x1="220" y1="220" x2="345" y2="315"/><line x1="220" y1="220" x2="250" y2="335"/><line x1="220" y1="220" x2="150" y2="320"/><line x1="220" y1="220" x2="80" y2="250"/><line x1="220" y1="220" x2="95" y2="190"/><line x1="220" y1="220" x2="300" y2="185"/><line x1="220" y1="220" x2="160" y2="250"/>
</g>
<g fill="#669BBC">
<circle cx="110" cy="130" r="11"/><circle cx="270" cy="105" r="11"/><circle cx="350" cy="140" r="11"/><circle cx="345" cy="315" r="11"/><circle cx="250" cy="335" r="11"/><circle cx="80" cy="250" r="11"/><circle cx="95" cy="190" r="11"/><circle cx="300" cy="185" r="9"/><circle cx="160" cy="250" r="9"/>
</g>
<circle class="pop n1" cx="180" cy="110" r="15" fill="#C1121F"/>
<circle class="pop n2" cx="380" cy="230" r="15" fill="#C1121F"/>
<circle class="pop n3" cx="150" cy="320" r="15" fill="#C1121F"/>
<circle class="pulse" cx="220" cy="220" r="26" fill="#003049"/>
<circle cx="220" cy="220" r="26" fill="#003049"/>
<circle cx="220" cy="220" r="12" fill="#FFFFFF"/>
</g>
<!-- risk gauge -->
<g transform="translate(60 120)">
<rect width="210" height="190" rx="20" fill="#0B4466"/>
<path d="M35 135 A70 70 0 0 1 175 135" fill="none" stroke="#1C5A80" stroke-width="18" stroke-linecap="round"/>
<path class="arc" d="M35 135 A70 70 0 0 1 175 135" fill="none" stroke="#C1121F" stroke-width="18" stroke-linecap="round"/>
<rect x="70" y="150" width="70" height="10" rx="5" fill="#A9C3D3"/>
<rect x="35" y="28" width="90" height="10" rx="5" fill="#FDF0D5"/>
</g>
</svg>
